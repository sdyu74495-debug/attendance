<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام تسجيل الحضور الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">

    <!-- Header -->
    <div class="max-w-md mx-auto flex justify-between items-center bg-slate-800 p-4 rounded-2xl mb-4 border border-slate-700">
        <div>
            <h1 class="font-bold text-lg">نظام الحضور الذكي</h1>
            <p id="roleStatus" class="text-xs text-slate-400">واجهة الطالب</p>
        </div>
        <button onclick="toggleRole()" class="bg-sky-600 text-xs px-3 py-2 rounded-xl font-bold">تبديل (طالب / أدمن)</button>
    </div>

    <div class="max-w-md mx-auto space-y-4">

        <!-- ===== STUDENT VIEW ===== -->
        <div id="studentView" class="space-y-4">
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                <span class="text-xs text-sky-400 font-bold">الطالب المسجل:</span>
                <h2 id="stdNameDisplay" class="text-xl font-bold mt-1">لم يتم التسجيل</h2>
                <button onclick="registerStudent()" class="mt-2 text-xs bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300">تعديل البيانات</button>
            </div>

            <div id="noLectureCard" class="bg-slate-800 p-8 rounded-2xl border border-slate-700 text-center">
                <i class="fa-solid fa-clock text-4xl text-slate-500 mb-2"></i>
                <h3 class="font-bold text-lg">لا يوجد جلسة نشطة حالياً</h3>
                <p class="text-xs text-slate-400 mt-1">بانتظار المحاضر لفتح باب الحضور...</p>
            </div>

            <div id="activeLectureCard" class="hidden bg-emerald-950/40 border border-emerald-500/40 p-5 rounded-2xl space-y-3">
                <div class="flex justify-between items-center">
                    <span class="bg-emerald-500 text-black text-[10px] font-bold px-2 py-0.5 rounded">جلسة مفتوحة</span>
                    <h3 id="lecTitleDisplay" class="font-bold text-lg">--</h3>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button onclick="submitGPS()" class="bg-emerald-600 hover:bg-emerald-500 font-bold py-3 text-xs rounded-xl">حضور بـ GPS</button>
                    <button onclick="openQRModal()" class="bg-sky-600 hover:bg-sky-500 font-bold py-3 text-xs rounded-xl">مسح الـ QR</button>
                </div>
                <p id="stdFeedback" class="text-xs text-center font-bold hidden p-2 rounded-lg"></p>
            </div>
        </div>

        <!-- ===== ADMIN VIEW ===== -->
        <div id="adminView" class="hidden space-y-4">
            <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
                <h3 class="font-bold text-sm text-sky-400">لوحة التحكم (الأدمن)</h3>
                <input type="text" id="lecInput" placeholder="اسم المحاضرة..." class="w-full bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs outline-none">
                
                <div class="flex gap-2">
                    <button onclick="startSession()" class="w-1/2 bg-emerald-600 font-bold py-2.5 text-xs rounded-xl">فتح باب الحضور</button>
                    <button onclick="stopSession()" class="w-1/2 bg-rose-600 font-bold py-2.5 text-xs rounded-xl">إغلاق المحاضرة فوراً</button>
                </div>
            </div>

            <div id="adminActiveStatus" class="hidden bg-slate-800 p-4 rounded-2xl border border-amber-500/50 text-center space-y-2">
                <p class="text-xs text-amber-400 font-bold">كود الـ QR المتغير حالياً:</p>
                <div id="qrCodeDisplay" class="text-2xl font-mono font-black text-amber-400 bg-slate-900 py-2 rounded-xl border border-slate-700">------</div>
            </div>
        </div>

    </div>

    <!-- ===== QR SCANNER MODAL ===== -->
    <div id="qrModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-xs p-4 relative text-center space-y-3">
            <button onclick="closeQRModal()" class="absolute -top-3 -left-3 w-10 h-10 rounded-full bg-rose-600 text-white font-black text-lg flex items-center justify-center shadow-lg border-2 border-slate-900 cursor-pointer">✕</button>
            
            <h3 class="font-bold text-sm">امسح كود الـ QR</h3>
            <div id="reader" class="overflow-hidden rounded-xl bg-slate-900 border border-slate-700 min-h-[180px]"></div>
            
            <div class="pt-2 border-t border-slate-700">
                <input type="text" id="manualCode" placeholder="أو اكتب الكود يدوياً..." class="w-full bg-slate-900 border border-slate-700 p-2 rounded-lg text-xs text-center outline-none mb-2">
                <button onclick="submitManualCode()" class="w-full bg-sky-600 text-xs font-bold py-2 rounded-lg">تأكيد الكود</button>
            </div>
            <p id="scannerMsg" class="text-xs font-bold text-rose-400 hidden"></p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrajT5UTM7vyTicRHwajaKYhqwDTXTpi8",
            authDomain: "amr1-60aa8.firebaseapp.com",
            databaseURL: "https://amr1-60aa8-default-rtdb.firebaseio.com",
            projectId: "amr1-60aa8",
            storageBucket: "amr1-60aa8.firebasestorage.app",
            messagingSenderId: "831137627248",
            appId: "1:831137627248:web:ad98adb7dd0274d73748b5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentRole = 'student';
        let currentToken = '';
        let html5QrcodeScanner = null;
        let activeLectureData = null;

        // القراءة المباشرة من السيرفر
        db.ref('activeLecture').on('value', (snap) => {
            activeLectureData = snap.val();
            if (activeLectureData) {
                document.getElementById('noLectureCard').classList.add('hidden');
                document.getElementById('activeLectureCard').classList.remove('hidden');
                document.getElementById('lecTitleDisplay').innerText = activeLectureData.title;
                document.getElementById('adminActiveStatus').classList.remove('hidden');
            } else {
                document.getElementById('noLectureCard').classList.remove('hidden');
                document.getElementById('activeLectureCard').classList.add('hidden');
                document.getElementById('adminActiveStatus').classList.add('hidden');
            }
        });

        db.ref('currentDynamicToken').on('value', (snap) => {
            currentToken = snap.val() || '';
            document.getElementById('qrCodeDisplay').innerText = currentToken || '------';
        });

        function registerStudent() {
            const name = prompt("ادخل اسمك الرباعي:");
            const code = prompt("ادخل كودك الجامعي:");
            if (name && code) {
                localStorage.setItem('std_name', name);
                localStorage.setItem('std_code', code);
                document.getElementById('stdNameDisplay').innerText = name + " (" + code + ")";
            }
        }

        window.onload = function() {
            const savedName = localStorage.getItem('std_name');
            if (savedName) {
                document.getElementById('stdNameDisplay').innerText = savedName + " (" + localStorage.getItem('std_code') + ")";
            } else {
                registerStudent();
            }
        };

        function toggleRole() {
            if (currentRole === 'student') {
                const pass = prompt("ادخل كلمة السر (كلمة السر هي: 1234):");
                if (pass && pass.trim() === '1234') {
                    currentRole = 'admin';
                    document.getElementById('studentView').classList.add('hidden');
                    document.getElementById('adminView').classList.remove('hidden');
                    document.getElementById('roleStatus').innerText = "واجهة الأدمن";
                } else {
                    alert("كلمة السر خاطئة! الكلمة هي 1234");
                }
            } else {
                currentRole = 'student';
                document.getElementById('adminView').classList.add('hidden');
                document.getElementById('studentView').classList.remove('hidden');
                document.getElementById('roleStatus').innerText = "واجهة الطالب";
            }
        }

        function startSession() {
            const title = document.getElementById('lecInput').value.trim() || "محاضرة جديدة";
            db.ref('activeLecture').set({ title: title, time: Date.now() });
            
            setInterval(() => {
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                db.ref('currentDynamicToken').set(code);
            }, 5000);
            alert("تم فتح الجلسة وبثها للجميع!");
        }

        function stopSession() {
            db.ref('activeLecture').remove();
            db.ref('currentDynamicToken').remove();
            alert("تم إغلاق المحاضرة فوراً من جميع الهواتف!");
        }

        function submitGPS() {
            const fb = document.getElementById('stdFeedback');
            fb.classList.remove('hidden');
            fb.className = "text-xs text-center font-bold bg-emerald-500/20 text-emerald-400 p-2 rounded-lg";
            fb.innerText = "تم تأكيد الحضور بـ GPS بنجاح!";
        }

        function openQRModal() {
            document.getElementById('qrModal').classList.remove('hidden');
            document.getElementById('scannerMsg').classList.add('hidden');
            
            try {
                html5QrcodeScanner = new Html5Qrcode("reader");
                html5QrcodeScanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 150 },
                    (text) => {
                        if (text === currentToken) {
                            alert("تم تسجيل حضورك بالـ QR بنجاح!");
                            closeQRModal();
                        } else {
                            document.getElementById('scannerMsg').innerText = "كود خاطئ أو انتهت صلاحيته!";
                            document.getElementById('scannerMsg').classList.remove('hidden');
                        }
                    }
                ).catch(() => {});
            } catch(e) {}
        }

        function closeQRModal() {
            document.getElementById('qrModal').classList.add('hidden');
            if (html5QrcodeScanner) {
                try {
                    html5QrcodeScanner.stop().then(() => html5QrcodeScanner.clear()).catch(() => {});
                } catch(e) {}
            }
        }

        function submitManualCode() {
            const code = document.getElementById('manualCode').value.trim();
            if (code === currentToken) {
                alert("تم تسجيل الحضور بنجاح!");
                closeQRModal();
            } else {
                document.getElementById('scannerMsg').innerText = "كود خاطئ!";
                document.getElementById('scannerMsg').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
